<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>eGovAI – logo chim hạc</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f1ea; color: #222; }
  .row { display: flex; gap: 28px; align-items: center; padding: 24px; flex-wrap: wrap; }
  .dark { background: #0b0b0f; color: #eee; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; }
  img { display: block; }
</style>
</head>
<body>
  <div class="row dark">
    <div class="tile"><img src="egovai-crane.svg" width="400" height="200"><span>Hình nét (nền tối)</span></div>
    <div class="tile"><img src="egovai-crane-mark.svg" width="220" height="220"><span>Dấu tròn 220px</span></div>
  </div>
  <div class="row" style="background:#fff">
    <div class="tile"><img src="egovai-crane-ink.svg" width="400" height="200"><span>Bản mực đen</span></div>
  </div>
  <div class="row">
    <div class="tile"><img src="egovai-crane-mark.svg" width="128" height="128"><span>128</span></div>
    <div class="tile"><img src="egovai-crane-mark.svg" width="64" height="64"><span>64</span></div>
    <div class="tile"><img src="egovai-crane-mark-small.svg" width="32" height="32"><span>32 (giản lược)</span></div>
    <div class="tile"><img src="egovai-crane-mark-small.svg" width="26" height="26"><span>26 (chat)</span></div>
    <div class="tile"><img src="egovai-crane-mark-small.svg" width="16" height="16"><span>16</span></div>
    <div class="tile"><img src="egovai-mark.svg" width="64" height="64"><span>Logo cũ</span></div>
  </div>
</body>
</html>
